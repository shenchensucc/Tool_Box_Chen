# Streamlit follows the process working directory for config discovery.
# Prefer: `streamlit run frontend/Home.py` from the repo root (matches Docker).

[client]
# Hide Streamlit's auto-generated multipage sidebar (pages/). We use custom st.page_link nav.
showSidebarNavigation = false

[theme]
# App light mode is our explicit palette (CSS tokens), not the OS/browser theme.
base = "light"
