# Machine-readable Dig Package KPI registry for tools/dig_package_kpi/check_kpi.py
# Template population uses dig_package_layout.json + resolve_field_cell (not Excel tmp_* defined names).
#
# check types:
#   - code_all: { file: rel/path, substrings: [str, ...] }  — all must appear
#   - code_any: { file: rel/path, substrings: [str, ...] }  — any suffices
#   - not_until_def: { file, function_name } — PASS when function exists (Joint Summary)
#
# effective: auto_pass if any check passes OR optional pytest passes when --with-tests

meta:
  version: 2
  repo_root: "."
  primary_module: backend/pipeline/dig_package.py
  test_module: tests/test_dig_package.py

sections:
  A:
    title: "A. Description (PNG Integrity template — project / location block)"
    items:
      - id: A-1
        name: "Dig Name (field dig_display; MDL Dig Name)"
        checks: [{ type: code_all, file: backend/pipeline/dig_package.py, substrings: ["dig_display", "resolve_field_cell", "_dig_display"] }]
        pytest: test_generate_dig_packages_template_cell_value_populated
      - id: A-2
        name: "Pipeline Name (field pipeline_name)"
        checks: [{ type: code_all, file: backend/pipeline/dig_package.py, substrings: ["pipeline_name", "resolve_field_cell"] }]
        pytest: test_generate_dig_packages_template_cell_value_populated
      - id: A-3
        name: "Target Girth Weld / TGW (MDL target_girth_weld; TGW chainage / matching)"
        checks: [{ type: code_all, file: backend/pipeline/dig_package.py, substrings: ["target_girth_weld", "mdl_col_map"] }]
        pytest: test_generate_dig_packages_template_cell_value_populated
      - id: A-4
        name: "Issue Date (field issue_date; MDL Dig Issuance / Revision / Cancellation Date, else =TODAY())"
        checks: [{ type: code_all, file: backend/pipeline/dig_package.py, substrings: ["issue_date", "_issue_date_cell_value", "Dig Issuance / Revision / Cancellation Date"] }]
        pytest: test_generate_dig_packages_template_cell_value_populated
      - id: A-5
        name: "Rev # (field revision; MDL dig_revision)"
        checks: [{ type: code_all, file: backend/pipeline/dig_package.py, substrings: ["revision", "resolve_field_cell", "dig_revision"] }]
        pytest: test_generate_dig_packages_template_cell_value_populated
      - id: A-6
        name: "TGW GPS — Lat / Long (fields latitude, longitude)"
        checks: [{ type: code_all, file: backend/pipeline/dig_package.py, substrings: ["latitude", "longitude", "resolve_field_cell"] }]
        pytest: test_generate_dig_packages_template_cell_value_populated
      - id: A-7
        name: "Nearest ROW MP / milepost (field milepost)"
        checks: [{ type: code_all, file: backend/pipeline/dig_package.py, substrings: ["milepost", "resolve_field_cell"] }]
        pytest: test_generate_dig_packages_template_cell_value_populated
      - id: A-8
